server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # The client router owns paths like /whatever, but no such file exists on
  # disk, so without this a refresh or a pasted deep link 404s.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Vite fingerprints these filenames, so they can be cached forever. One
  # header rather than `expires` plus `add_header`, which emits two.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html must never be cached: it points at fingerprinted bundles that
  # stop existing on the next deploy.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Same origin in the browser, so no CORS preflight and no VITE_API_URL baked
  # into the bundle. The frontend calls a relative /api/... in dev and in prod.
  location /api/ {
    proxy_pass http://api:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
